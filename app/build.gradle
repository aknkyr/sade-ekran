plugins {
    id 'com.android.application'
}

android {
    namespace 'app.sade.ekran'
    compileSdk 34

    defaultConfig {
        applicationId 'app.sade.ekran'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('sade.jks')
            storePassword 'sadeekran'
            keyAlias 'sade'
            keyPassword 'sadeekran'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
