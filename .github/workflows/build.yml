name: APK derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Derle
        run: gradle :app:assembleRelease --no-daemon
      - name: APK adini duzenle
        run: cp app/build/outputs/apk/release/app-release.apk SadeEkran.apk
      - name: Surum yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Sade Ekran ${{ github.run_number }}
          files: SadeEkran.apk
